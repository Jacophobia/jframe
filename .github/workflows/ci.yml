name: CI

on:
  push:
    branches: [mainline, develop]
  pull_request:
    branches: [mainline, develop]

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            preset: macos-debug
            name: macOS (Apple Silicon)
          - os: ubuntu-24.04
            preset: linux-debug
            name: Linux
          - os: windows-2022
            preset: windows-debug
            name: Windows

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # =========================================================================
      # macOS Setup
      # =========================================================================
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm ninja cmake

          # Find the installed LLVM version (prefer @20, fall back to latest)
          if [ -d "/opt/homebrew/opt/llvm@20" ]; then
            LLVM_PATH="/opt/homebrew/opt/llvm@20"
          elif [ -d "/opt/homebrew/opt/llvm" ]; then
            LLVM_PATH="/opt/homebrew/opt/llvm"
          else
            echo "Error: LLVM not found"
            exit 1
          fi

          echo "Using LLVM at: $LLVM_PATH"
          echo "CC=${LLVM_PATH}/bin/clang" >> $GITHUB_ENV
          echo "CXX=${LLVM_PATH}/bin/clang++" >> $GITHUB_ENV

          # Verify version
          ${LLVM_PATH}/bin/clang++ --version

      # =========================================================================
      # Linux Setup
      # =========================================================================
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev \
            libwayland-dev libxkbcommon-dev \
            ninja-build wget lsb-release software-properties-common gnupg

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          # Add LLVM apt repository
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh

          # Try LLVM 20, fall back to 19, then 18
          if sudo ./llvm.sh 20 all; then
            echo "CC=clang-20" >> $GITHUB_ENV
            echo "CXX=clang++-20" >> $GITHUB_ENV
          elif sudo ./llvm.sh 19 all; then
            echo "CC=clang-19" >> $GITHUB_ENV
            echo "CXX=clang++-19" >> $GITHUB_ENV
          elif sudo ./llvm.sh 18 all; then
            echo "CC=clang-18" >> $GITHUB_ENV
            echo "CXX=clang++-18" >> $GITHUB_ENV
          else
            echo "Error: Could not install LLVM"
            exit 1
          fi

      - name: Verify LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          $CXX --version

      # =========================================================================
      # Windows Setup
      # =========================================================================
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Download LLVM from GitHub releases
          $llvmVersion = "18.1.8"
          $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-${llvmVersion}/LLVM-${llvmVersion}-win64.exe"
          $installerPath = "$env:TEMP\llvm-installer.exe"

          Write-Host "Downloading LLVM ${llvmVersion}..."
          Invoke-WebRequest -Uri $llvmUrl -OutFile $installerPath

          Write-Host "Installing LLVM..."
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait

          # Add to PATH and set environment variables
          $llvmBin = "C:\Program Files\LLVM\bin"
          echo "$llvmBin" >> $env:GITHUB_PATH
          echo "CC=$llvmBin\clang.exe" >> $env:GITHUB_ENV
          echo "CXX=$llvmBin\clang++.exe" >> $env:GITHUB_ENV

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Verify LLVM (Windows)
        if: runner.os == 'Windows'
        run: |
          & "C:\Program Files\LLVM\bin\clang++.exe" --version

      # =========================================================================
      # vcpkg Setup (all platforms)
      # =========================================================================
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "9aee6e968f51e15ee93606f064691d8f6d228190"
          runVcpkgInstall: false

      # =========================================================================
      # Build & Test
      # =========================================================================
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          export VCPKG_ROOT="${{ github.workspace }}/vcpkg"
          cmake --preset ${{ matrix.preset }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "${{ github.workspace }}\vcpkg"
          cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      # =========================================================================
      # Upload artifacts
      # =========================================================================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.os }}
          path: |
            build/${{ matrix.preset }}/lib
            build/${{ matrix.preset }}/bin
            build/${{ matrix.preset }}/compile_commands.json
          retention-days: 7
