name: CI

on:
  push:
    branches: [mainline, develop]
  pull_request:
    branches: [mainline, develop]

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            preset: macos-debug
            name: macOS (Apple Silicon)
          - os: ubuntu-24.04
            preset: linux-debug
            name: Linux
          # TODO: Windows CI is temporarily disabled pending C++23 'import std;' support
          # LLVM on Windows doesn't include libc++ modules. Options being explored:
          # 1. MSYS2 CLANG64 with x64-mingw-dynamic triplet (vcpkg compatibility issues)
          # 2. Wait for Clang 21+ with clang-cl MSVC STL module support
          # 3. Build libc++ from source with module support
          # See: https://github.com/llvm/llvm-project/issues/93722
          # - os: windows-2022
          #   preset: windows-debug
          #   name: Windows

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # =========================================================================
      # macOS Setup
      # =========================================================================
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm@20 ninja cmake

          # Determine Homebrew prefix (different on ARM vs Intel)
          if [ -d "/opt/homebrew/opt/llvm@20" ]; then
            LLVM_PATH="/opt/homebrew/opt/llvm@20"
          elif [ -d "/usr/local/opt/llvm@20" ]; then
            LLVM_PATH="/usr/local/opt/llvm@20"
          else
            echo "Error: LLVM@20 not found"
            exit 1
          fi

          echo "Using LLVM at: $LLVM_PATH"
          echo "JFRAME_CC=${LLVM_PATH}/bin/clang" >> $GITHUB_ENV
          echo "JFRAME_CXX=${LLVM_PATH}/bin/clang++" >> $GITHUB_ENV

          # Set library paths for consistent libc++ usage
          echo "LDFLAGS=-L${LLVM_PATH}/lib -L${LLVM_PATH}/lib/c++ -Wl,-rpath,${LLVM_PATH}/lib/c++" >> $GITHUB_ENV
          echo "CPPFLAGS=-I${LLVM_PATH}/include" >> $GITHUB_ENV

          # Verify version
          ${LLVM_PATH}/bin/clang++ --version

      # =========================================================================
      # Linux Setup
      # =========================================================================
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev \
            libwayland-dev libxkbcommon-dev \
            autoconf autoconf-archive automake libtool libltdl-dev \
            ninja-build wget lsb-release software-properties-common gnupg

      - name: Install Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          # Install LLVM 20 from LLVM apt repository
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20 all

          # Set for our project build (not for vcpkg)
          echo "JFRAME_CC=clang-20" >> $GITHUB_ENV
          echo "JFRAME_CXX=clang++-20" >> $GITHUB_ENV

      # =========================================================================
      # vcpkg Setup (all platforms)
      # =========================================================================
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "9aee6e968f51e15ee93606f064691d8f6d228190"
          runVcpkgInstall: false

      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV

      # =========================================================================
      # Build & Test
      # =========================================================================
      - name: Configure
        run: |
          export CC=$JFRAME_CC
          export CXX=$JFRAME_CXX
          cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      # =========================================================================
      # Upload artifacts
      # =========================================================================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.os }}
          path: |
            build/${{ matrix.preset }}/lib
            build/${{ matrix.preset }}/bin
            build/${{ matrix.preset }}/compile_commands.json
          retention-days: 7
