name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            preset: macos-release
            artifact_name: jframe-macos-arm64
            name: macOS (Apple Silicon)
          - os: macos-13
            preset: macos-release
            artifact_name: jframe-macos-x64
            name: macOS (Intel)
          - os: ubuntu-24.04
            preset: linux-release
            artifact_name: jframe-linux-x64
            name: Linux
          - os: windows-2022
            preset: windows-release
            artifact_name: jframe-windows-x64
            name: Windows

    name: Build Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # =========================================================================
      # macOS Setup
      # =========================================================================
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm@20 ninja cmake

          # Determine Homebrew prefix (different on ARM vs Intel)
          if [ -d "/opt/homebrew/opt/llvm@20" ]; then
            LLVM_PATH="/opt/homebrew/opt/llvm@20"
          elif [ -d "/usr/local/opt/llvm@20" ]; then
            LLVM_PATH="/usr/local/opt/llvm@20"
          else
            echo "Error: LLVM@20 not found"
            exit 1
          fi

          echo "Using LLVM at: $LLVM_PATH"
          echo "CC=${LLVM_PATH}/bin/clang" >> $GITHUB_ENV
          echo "CXX=${LLVM_PATH}/bin/clang++" >> $GITHUB_ENV

          # Set library paths for consistent libc++ usage
          echo "LDFLAGS=-L${LLVM_PATH}/lib -L${LLVM_PATH}/lib/c++ -Wl,-rpath,${LLVM_PATH}/lib/c++" >> $GITHUB_ENV
          echo "CPPFLAGS=-I${LLVM_PATH}/include" >> $GITHUB_ENV

          # Verify version
          ${LLVM_PATH}/bin/clang++ --version

      # =========================================================================
      # Linux Setup
      # =========================================================================
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev \
            libwayland-dev libxkbcommon-dev \
            ninja-build wget lsb-release software-properties-common gnupg

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          # Install LLVM 20 from LLVM apt repository
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20 all

          echo "CC=clang-20" >> $GITHUB_ENV
          echo "CXX=clang++-20" >> $GITHUB_ENV

      - name: Verify LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          clang++-20 --version

      # =========================================================================
      # Windows Setup
      # =========================================================================
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Download LLVM 20 from GitHub releases
          $llvmVersion = "20.1.6"
          $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-${llvmVersion}/LLVM-${llvmVersion}-win64.exe"
          $installerPath = "$env:TEMP\llvm-installer.exe"

          Write-Host "Downloading LLVM ${llvmVersion}..."
          Invoke-WebRequest -Uri $llvmUrl -OutFile $installerPath

          Write-Host "Installing LLVM..."
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait

          # Add to PATH and set environment variables
          $llvmBin = "C:\Program Files\LLVM\bin"
          echo "$llvmBin" >> $env:GITHUB_PATH
          echo "CC=$llvmBin\clang.exe" >> $env:GITHUB_ENV
          echo "CXX=$llvmBin\clang++.exe" >> $env:GITHUB_ENV

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Verify LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "C:\Program Files\LLVM\bin\clang++.exe" --version

      # =========================================================================
      # vcpkg Setup
      # =========================================================================
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "9aee6e968f51e15ee93606f064691d8f6d228190"
          runVcpkgInstall: false

      # =========================================================================
      # Build Release
      # =========================================================================
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          export VCPKG_ROOT="${{ github.workspace }}/vcpkg"
          cmake --preset ${{ matrix.preset }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "${{ github.workspace }}\vcpkg"
          cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Install
        run: cmake --install build/${{ matrix.preset }} --prefix install/${{ matrix.artifact_name }}

      # =========================================================================
      # Package
      # =========================================================================
      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd install
          tar -czvf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd install
          Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            install/${{ matrix.artifact_name }}.tar.gz
            install/${{ matrix.artifact_name }}.zip
          if-no-files-found: error

  # =============================================================================
  # Create GitHub Release
  # =============================================================================
  publish:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -la artifacts/*/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
