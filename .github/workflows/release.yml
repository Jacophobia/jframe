name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            preset: macos-release
            artifact_name: jframe-macos-arm64
            name: macOS (Apple Silicon)
          - os: macos-13
            preset: macos-release
            artifact_name: jframe-macos-x64
            name: macOS (Intel)
          - os: ubuntu-24.04
            preset: linux-release
            artifact_name: jframe-linux-x64
            name: Linux
          - os: windows-2022
            preset: windows-release
            artifact_name: jframe-windows-x64
            name: Windows

    name: Build Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # =========================================================================
      # macOS Setup
      # =========================================================================
      - name: Install LLVM 20 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@20 ninja
          # Handle both Apple Silicon and Intel paths
          if [ -d "/opt/homebrew/opt/llvm@20" ]; then
            echo "CC=/opt/homebrew/opt/llvm@20/bin/clang" >> $GITHUB_ENV
            echo "CXX=/opt/homebrew/opt/llvm@20/bin/clang++" >> $GITHUB_ENV
          else
            echo "CC=/usr/local/opt/llvm@20/bin/clang" >> $GITHUB_ENV
            echo "CXX=/usr/local/opt/llvm@20/bin/clang++" >> $GITHUB_ENV
          fi

      # =========================================================================
      # Linux Setup
      # =========================================================================
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev \
            libwayland-dev libxkbcommon-dev \
            ninja-build

      - name: Install LLVM 20 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20 all
          echo "CC=clang-20" >> $GITHUB_ENV
          echo "CXX=clang++-20" >> $GITHUB_ENV

      # =========================================================================
      # Windows Setup
      # =========================================================================
      - name: Install LLVM 20 (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm --version=20.1.0 -y
          echo "CC=C:\Program Files\LLVM\bin\clang.exe" >> $env:GITHUB_ENV
          echo "CXX=C:\Program Files\LLVM\bin\clang++.exe" >> $env:GITHUB_ENV

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      # =========================================================================
      # vcpkg Setup
      # =========================================================================
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "9aee6e968f51e15ee93606f064691d8f6d228190"

      # =========================================================================
      # Build Release
      # =========================================================================
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Install
        run: cmake --install build/${{ matrix.preset }} --prefix install/${{ matrix.artifact_name }}

      # =========================================================================
      # Package
      # =========================================================================
      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd install
          tar -czvf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd install
          Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            install/${{ matrix.artifact_name }}.tar.gz
            install/${{ matrix.artifact_name }}.zip
          if-no-files-found: error

  # =============================================================================
  # Create GitHub Release
  # =============================================================================
  publish:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -la artifacts/*/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
